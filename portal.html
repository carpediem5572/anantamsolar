<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shivaji Hostel Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<script>
  // 🔐 Protect Page
  if (!localStorage.getItem("isLoggedIn")) {
    window.location.href = "login.html";
  }
</script>

<div class="portal-container">

  <!-- 🔷 HEADER -->
  <header class="top-bar">
    <div class="logo-title">
      <h2>Shivaji Hostel Admin Portal</h2>
      <p class="sub-info">Attendance Management System</p>
    </div>

    <div class="admin-controls">
      <span id="adminName"></span>
      <button onclick="logout()" class="logout-btn">
        <i data-lucide="log-out"></i>
        <span>Logout</span>
      </button>
    </div>
  </header>

  <!-- 🔷 HOSTEL SELECTION -->
  <section id="hostelSelection" class="card-section">
    <div class="card" onclick="openHostel('SBH')">
      <div class="card-icon"><i data-lucide="home"></i></div>
      <h3>Shivaji Boys Hostel</h3>
      <p>6 Buildings • 150+ Students</p>
    </div>

    <div class="card" onclick="openHostel('SGH')">
      <div class="card-icon"><i data-lucide="home"></i></div>
      <h3>Shivaji Girls Hostel</h3>
      <p>Attendance & Records</p>
    </div>
  </section>

  <!-- 🔷 MAIN HOSTEL SECTION -->
  <section id="hostelSection" class="hostel-section" style="display:none;">

    <!-- SECTION HEADER -->
    <div class="section-header">

      <div class="left-controls">
        <button onclick="goBack()" class="back-btn">
          <i data-lucide="arrow-left"></i>
          <span>Back</span>
        </button>
        <h3 id="hostelTitle"></h3>
      </div>

      <div class="right-controls">
        <input type="date" id="attendanceDate">
        <button onclick="openAddStudent()" class="add-btn">
          <i data-lucide="user-plus"></i>
          <span>Add Student</span>
        </button>
        <button onclick="saveAttendance()" class="save-btn">
          <i data-lucide="save"></i>
          <span>Save</span>
        </button>
      </div>

    </div>

    <!-- BUILDING TABS -->
    <div id="buildingTabs" class="tabs"></div>

    <!-- LIVE COUNTER -->
    <div class="live-counter">
      <div class="counter-box">
        <span>Total Students</span>
        <b id="totalCount">0</b>
      </div>

      <div class="counter-box present-box">
        <span>Present</span>
        <b id="presentCount">0</b>
      </div>

      <div class="counter-box absent-box">
        <span>Absent</span>
        <b id="absentCount">0</b>
      </div>
    </div>

    <!-- ATTENDANCE LIST -->
    <div id="attendanceList" class="attendance-list"></div>

    <!-- SKELETON LOADER (Hidden by default) -->
    <div id="skeletonLoader" class="skeleton-list" style="display: none;">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

  </section>

</div>

<!-- 🔷 ADD STUDENT MODAL -->
<div id="addStudentModal" class="modal">
  <div class="modal-content">

    <div class="modal-header">
      <h3>Add New Student</h3>
      <button onclick="closeAddStudent()" class="close-btn"><i data-lucide="x"></i></button>
    </div>

    <div class="modal-body">
      <div class="input-group">
        <i data-lucide="hash"></i>
        <input type="text" id="newHostelNo" placeholder="Hostel No">
      </div>
      <div class="input-group">
        <i data-lucide="user"></i>
        <input type="text" id="newStudentName" placeholder="Student Name">
      </div>
      <div class="input-group">
        <i data-lucide="building-2"></i>
        <select id="newBuilding"></select>
      </div>
    </div>

    <div class="modal-footer">
      <button onclick="saveStudent()" class="save-btn">Save Student</button>
      <button onclick="closeAddStudent()" class="cancel-btn">Cancel</button>
    </div>

  </div>
</div>

<!-- 🔷 LOADING OVERLAY -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="loader"></div>
  <p>Processing...</p>
</div>

<script src="js/app.js"></script>
<script>
  lucide.createIcons();
</script>
</body>
</html>
